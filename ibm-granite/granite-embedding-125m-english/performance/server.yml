# This embedding model has max_position_embeddings=512. The common/performance
# default of 8192 makes vLLM abort at startup: "User-specified max_model_len
# (8192) is greater than the derived max_model_len (max_position_embeddings=512
# ...)".
max-model-len: 512
tensor-parallel-size: 1
trust-remote-code: true
uvicorn-log-level: debug
no-enable-prefix-caching: true

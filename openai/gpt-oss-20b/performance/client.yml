data:
  prompt_tokens: 1000
  output_tokens: 1000
rate-type: concurrent
max-seconds: 500
max-requests: 300
rate: 1,25,50,100
warmup:
  percent: 0.05
  mode: prefer_requests
cooldown:
  percent: 0.05
  mode: prefer_requests
backend-kwargs: '{"extras": {"body": {"temperature": 0, "max_tokens": 1000, "min_tokens": 1000}}}'

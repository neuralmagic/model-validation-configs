tensor-parallel-size: 1
# GB10 has no dedicated VRAM: ~120 GiB unified LPDDR5X shared with the host, of
# which only ~54 GiB was free at startup. The default gpu-memory-utilization
# (0.92 -> 110.71 GiB) fails the startup free-memory check. This 137M-param
# embedding model needs a tiny fraction of that.
gpu-memory-utilization: 0.2
trust-remote-code: true
uvicorn-log-level: debug
# https://huggingface.co/RedHatAI/Mistral-Small-3.1-24B-Instruct-2503-FP8-dynamic
# FP8 repo lacks consolidated.safetensors, so vLLM defaults to HF tokenizer
# path which crashes (CachedMistralCommonBackend missing is_fast).
# Force Mistral tokenizer mode to use the correct tokenizer backend.
tokenizer-mode: mistral
trust-remote-code: true
uvicorn-log-level: debug
max-model-len: 32768
config-format: mistral
# WORKAROUND: this FP8 checkpoint returns NaN logits on image requests (text
# passes, both vision smoke tests fail with "Out of range float values are not
# JSON compliant: nan") via the pixtral.py FP8 path. Try enforce-eager to rule
# out an FP8/multimodal torch.compile or cudagraph miscompile as the NaN source.
enforce-eager: true
